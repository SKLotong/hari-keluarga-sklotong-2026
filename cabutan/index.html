<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabutan Nama Bertuah · Hari Keluarga SK Lotong 2026</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<style>
  @font-face { font-family: "Butterpop"; src: url("../fon/Butterpop-Regular.woff") format("woff"); font-display: swap; }
  @font-face { font-family: "Quicksand"; src: url("../fon/Quicksand-Regular.woff") format("woff"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Quicksand"; src: url("../fon/Quicksand-Bold.woff") format("woff"); font-weight: 700; font-display: swap; }
  :root {
    --biru-tua: #0E245E; --biru: #1F4FA3; --teal: #0DB3A6; --teal-tua: #0B7F77; --kuning: #FCB62A; --kuning-cerah: #FFE08A;
    --merah: #D7262B; --koral: #FA5242; --krim: #FFF8EA; --dakwat: #1D2340; --kelabu: #5B6078;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Quicksand", system-ui, sans-serif; color: var(--dakwat); overflow: hidden;
         background: radial-gradient(ellipse at 50% 40%, #fffdf6 0%, #fff3d6 55%, #fde3b0 100%); }
  button { font: inherit; cursor: pointer; }

  .hias { position: fixed; pointer-events: none; z-index: 0; }
  .bunting { top: -3vh; left: 50%; transform: translateX(-50%); height: 11vh; width: auto; max-width: 96vw; opacity: .95; }
  .bunga-kiri { left: -3vw; bottom: -9vh; width: min(200px, 15vw); transform: scaleY(-1); opacity: .9; }
  .bunga-kanan { right: -3vw; bottom: -9vh; width: min(200px, 15vw); opacity: .9; }

  /* ---------- Susun atur ---------- */
  .susun { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: 1fr minmax(230px, 20vw);
           grid-template-rows: auto auto 1fr auto; gap: 1.2vh 1.6vw; padding: 8.5vh 2vw 1.8vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 1.2vw; }
  header img { width: clamp(40px, 5.2vh, 66px); }
  header h1 { font: 400 clamp(22px, 4.2vh, 50px)/1 "Butterpop", sans-serif; color: var(--merah); }
  header p { margin-top: .5vh; font-weight: 700; font-size: clamp(11px, 1.6vh, 18px); color: var(--teal-tua); letter-spacing: .12em; text-transform: uppercase; }

  .alatan { grid-column: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 1vh 1.4vw; }
  .butang-utama { padding: 1.4vh 4vw; border: 0; border-radius: 99px; background: var(--teal); color: #fff;
                  font: 400 clamp(20px, 3.4vh, 40px)/1 "Butterpop", sans-serif; letter-spacing: .03em;
                  box-shadow: 0 .7vh 0 var(--teal-tua), 0 1.6vh 3vh rgba(11,127,119,.3); transition: transform .1s; }
  .butang-utama:active { transform: translateY(.5vh); box-shadow: 0 .2vh 0 var(--teal-tua); }
  .butang-utama:disabled { background: #9fb9b6; box-shadow: 0 .7vh 0 #7d9894; cursor: default; }
  .tidak-hadir { border: .3vh solid var(--koral); background: #fff; color: var(--merah); border-radius: 99px;
                 padding: .9vh 1.8vw; font-weight: 700; font-size: clamp(12px, 1.8vh, 19px); display: none; }
  .tidak-hadir.nampak { display: inline-block; }
  .petunjuk { font-size: clamp(11px, 1.5vh, 15px); color: var(--kelabu); font-weight: 700; }

  /* ---------- Papan nama ---------- */
  .bingkai { grid-column: 1; grid-row: 3; position: relative; min-height: 0; border-radius: 2.4vh; background: rgba(255,255,255,.55);
             border: .35vh solid #f3d796; box-shadow: inset 0 0 0 .4vh rgba(255,255,255,.6); }
  #papan { position: absolute; inset: 0; padding: var(--jarak, 8px); display: grid; gap: var(--jarak, 8px);
           grid-template-columns: repeat(var(--kol, 4), minmax(0, 1fr)); grid-auto-rows: var(--tinggi, 60px);
           align-content: start; overflow: hidden; border-radius: inherit; }
  #papan.tatal { overflow-y: auto; scroll-behavior: smooth; }
  #papan.tatal::-webkit-scrollbar { width: 10px; } #papan.tatal::-webkit-scrollbar-thumb { background: #e7c77b; border-radius: 9px; }
  .petak { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
           padding: .25em .4em; border-radius: .45em; background: #fff; border: 2px solid #f1dfb5; box-shadow: 0 .14em 0 #f1dfb5;
           font-size: var(--fon, 16px); line-height: 1.12; overflow: hidden; transform-style: preserve-3d; }
  .petak .n { font-weight: 700; color: var(--biru-tua); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .petak .t { margin-top: .2em; font-size: .6em; font-weight: 700; color: var(--teal-tua); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  #papan.tanpa-tempat .petak .t { display: none; }
  .petak .tanda { position: absolute; top: 0; right: 0; padding: .12em .5em; border-bottom-left-radius: .5em; font-size: .52em; font-weight: 700;
                  letter-spacing: .03em; display: none; white-space: nowrap; }
  .petak.menang { background: linear-gradient(160deg, #fff6d6, #ffe08a); border-color: var(--kuning); box-shadow: 0 .14em 0 #e9a514; }
  .petak.menang .tanda { display: block; background: var(--kuning); color: var(--biru-tua); }
  .petak.batal { background: #f1f1f1; border-color: #d6d6d6; box-shadow: 0 .14em 0 #cfcfcf; }
  .petak.batal .n { color: #8a8a8a; text-decoration: line-through; }
  .petak.batal .t { color: #9a9a9a; }
  .petak.batal .tanda { display: block; background: #cfcfcf; color: #555; }
  .petak.sasaran { z-index: 2; border-color: var(--koral); box-shadow: 0 0 0 .2em #fff, 0 0 0 .38em var(--koral), 0 0 1.6em .6em rgba(250,82,66,.55);
                   animation: nadi 1s ease-in-out infinite; }
  @keyframes nadi { 50% { box-shadow: 0 0 0 .2em #fff, 0 0 0 .38em var(--koral), 0 0 2.4em 1em rgba(250,82,66,.7); } }
  .petak.gegar { animation: gegar .45s ease-in-out; }
  @keyframes gegar { 20% { transform: translate(-6%, 2%) rotate(-3deg); } 40% { transform: translate(5%, -2%) rotate(3deg); } 60% { transform: translate(-3%, 1%) rotate(-2deg); } 80% { transform: translate(2%, 0) rotate(1deg); } }
  .petak.terbalik { animation: terbalik .8s cubic-bezier(.3,1.4,.5,1); }
  @keyframes terbalik { 0% { transform: perspective(600px) rotateY(0); } 50% { transform: perspective(600px) rotateY(180deg) scale(1.15); background: var(--kuning); } 100% { transform: perspective(600px) rotateY(360deg); } }
  .papan-kosong { grid-column: 1 / -1; align-self: center; text-align: center; padding: 4vh 2vw; color: var(--kelabu); font-weight: 700; font-size: clamp(14px, 2.2vh, 22px); }

  /* ---------- Kad pemenang (di atas papan) ---------- */
  #kadMenang { position: absolute; inset: 0; z-index: 4; display: none; align-items: flex-start; justify-content: center; padding-top: 4%;
               background: rgba(255,248,234,.5); border-radius: inherit; cursor: pointer; }
  #kadMenang.nampak { display: flex; }
  #kadMenang .kad { width: min(94%, 1100px); padding: 3.2vh 3vw 2.6vh; border-radius: 3.6vh; background: #fff; text-align: center;
                    border: .6vh solid var(--koral); box-shadow: 0 1vh 0 var(--koral), 0 3vh 8vh rgba(250,82,66,.35);
                    animation: muncul .55s cubic-bezier(.2,1.5,.4,1); }
  @keyframes muncul { from { transform: scale(.4) translateY(-10vh); opacity: 0; } }
  #kadMenang .label { font-weight: 700; letter-spacing: .3em; font-size: clamp(13px, 2.2vh, 24px); color: var(--koral); text-transform: uppercase; }
  #kadMenang .nama { margin-top: 1.2vh; font: 400 10vh/1.08 "Butterpop", sans-serif; color: var(--merah); overflow-wrap: anywhere; }
  #kadMenang .tempat { margin-top: 1.4vh; font-weight: 700; font-size: clamp(16px, 3.4vh, 40px); color: var(--teal-tua); }
  #kadMenang .tutup { margin-top: 1.6vh; font-size: clamp(10px, 1.4vh, 14px); color: var(--kelabu); font-weight: 700; }

  /* ---------- Senarai pemenang ---------- */
  aside { grid-row: 2 / 4; grid-column: 2; display: flex; flex-direction: column; min-height: 0; background: rgba(255,255,255,.88);
          border-radius: 2.6vh; border: .4vh solid var(--teal); box-shadow: 0 .7vh 0 var(--teal); overflow: hidden; }
  aside h2 { padding: 1.4vh 1.2vw; background: var(--teal); color: #fff; font: 400 clamp(17px, 2.7vh, 30px)/1 "Butterpop", sans-serif; display: flex; justify-content: space-between; align-items: center; }
  aside h2 span { font: 700 clamp(13px, 1.9vh, 21px)/1 "Quicksand", sans-serif; background: rgba(255,255,255,.25); padding: .5vh .9vw; border-radius: 99px; }
  #senarai { list-style: none; overflow-y: auto; flex: 1; padding: .8vh .7vw 1.2vh; counter-reset: p; }
  #senarai li { counter-increment: p; display: grid; grid-template-columns: 3.2vh 1fr; gap: .7vw; align-items: start; padding: .9vh .3vw; border-bottom: .2vh dashed #e8dcc0; }
  #senarai li::before { content: counter(p); width: 3.2vh; height: 3.2vh; border-radius: 50%; background: var(--kuning); color: var(--biru-tua);
                        display: grid; place-items: center; font: 700 clamp(11px, 1.6vh, 17px)/1 "Quicksand", sans-serif; }
  #senarai b { display: block; font-size: clamp(12px, 1.9vh, 20px); color: var(--biru-tua); line-height: 1.2; overflow-wrap: anywhere; }
  #senarai small { display: block; margin-top: .3vh; font-size: clamp(10px, 1.5vh, 15px); font-weight: 700; color: var(--teal-tua); }
  #senarai li.batal::before { content: "✕"; background: #eee; color: var(--kelabu); }
  #senarai li.batal { counter-increment: none; }
  #senarai li.batal b { text-decoration: line-through; color: var(--kelabu); }
  #senarai li.batal small::after { content: " · tiada di dewan"; color: var(--koral); }
  #senarai .kosong { display: block; padding: 2vh 1vw; color: var(--kelabu); font-weight: 700; font-size: clamp(12px, 1.8vh, 18px); }
  #senarai .kosong::before { display: none; }

  footer { position: relative; z-index: 2; grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 1vh 1vw; align-items: center; justify-content: space-between;
           font-weight: 700; font-size: clamp(11px, 1.6vh, 16px); color: var(--kelabu); }
  footer .kiraan { background: rgba(255,255,255,.85); padding: .7vh 1.3vw; border-radius: 99px; }
  footer .kiraan b { color: var(--biru-tua); font-size: 1.25em; }
  footer .alat { display: flex; flex-wrap: wrap; gap: .7vw; }
  footer .alat button, footer .alat label { border: .2vh solid #d9c9a4; background: rgba(255,255,255,.85); color: var(--dakwat); border-radius: 99px;
                         padding: .7vh 1.1vw; font-weight: 700; font-size: inherit; cursor: pointer; }
  footer .alat input { display: none; }
  #status.ralat { color: var(--merah); }

  /* ---------- Lapisan animasi & konfeti ---------- */
  #lapisan { position: fixed; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
  #lapisan > * { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  #lapisan .judul { left: 50%; top: 13vh; transform: translateX(-50%); padding: .8vh 2.4vw; border-radius: 99px; background: var(--biru-tua); color: #fff;
                    font: 400 clamp(16px, 2.6vh, 28px)/1 "Butterpop", sans-serif; letter-spacing: .03em; box-shadow: 0 .5vh 0 rgba(0,0,0,.2);
                    animation: judul 2.9s ease forwards; }
  @keyframes judul { 0% { opacity: 0; transform: translate(-50%, -2vh) scale(.8); } 12%, 82% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; } }
  canvas#konfeti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 7; }

  @media (max-aspect-ratio: 1/1) {
    body { overflow: auto; }
    .susun { grid-template-columns: 1fr; grid-template-rows: auto auto 62vh auto auto; height: auto; min-height: 100%; padding-top: 7vh; }
    .alatan, .bingkai { grid-column: 1; } .bingkai { grid-row: 3; }
    aside { grid-row: 4; grid-column: 1; max-height: 40vh; }
    #kadMenang .nama { font-size: 6vh; }
  }
</style>
</head>
<body>
<img class="hias bunting" src="bunting.webp" alt="">
<img class="hias bunga-kiri" src="bunga_kiri.webp" alt="">
<img class="hias bunga-kanan" src="bunga_kanan.webp" alt="">
<div id="lapisan" aria-hidden="true"></div>
<canvas id="konfeti"></canvas>

<div class="susun">
  <header>
    <img src="logo.png" alt="Logo SK Lotong">
    <div><h1>Cabutan Nama Bertuah</h1><p>Hari Keluarga SK Lotong · Isnin, 16 November 2026</p></div>
  </header>

  <div class="alatan">
    <button class="butang-utama" id="cabut" disabled>Cabut Nama</button>
    <button class="tidak-hadir" id="tidakHadir" title="Tandakan pemenang terakhir tiada di dewan, kemudian cabut semula">Tiada di dewan? Cabut semula</button>
    <span class="petunjuk"><b>Space</b>/<b>Enter</b> cabut · <b>F</b> skrin penuh · <b>Esc</b> tutup kad</span>
  </div>

  <main class="bingkai">
    <div id="papan" aria-label="Papan nama peserta"></div>
    <div id="kadMenang" role="dialog" aria-live="assertive" title="Klik untuk tutup">
      <div class="kad">
        <div class="label">🎉 Tahniah! 🎉</div>
        <div class="nama" id="namaMenang"></div>
        <div class="tempat" id="tempatMenang"></div>
        <div class="tutup">Klik atau tekan Esc untuk kembali ke papan</div>
      </div>
    </div>
  </main>

  <aside>
    <h2>Pemenang <span id="bilMenang">0</span></h2>
    <ol id="senarai"><li class="kosong">Belum ada pemenang.</li></ol>
  </aside>

  <footer>
    <div class="kiraan">Peserta: <b id="bilPeserta">0</b> · Baki dalam cabutan: <b id="bilBaki">0</b> · <span id="status">Memuatkan senarai…</span></div>
    <div class="alat">
      <button id="muatSemula" title="Ambil senarai terkini daripada Google Sheet">↻ Muat semula senarai</button>
      <label title="Guna fail CSV (Nama, Tempat) jika internet terputus">⇪ Muat naik CSV<input type="file" id="failCsv" accept=".csv,text/csv"></label>
      <button id="bunyi" title="Hidup/matikan bunyi">🔊 Bunyi</button>
      <button id="skrinPenuh">⛶ Skrin penuh</button>
      <button id="setSemula" title="Kosongkan senarai pemenang">Set semula</button>
    </div>
  </footer>
</div>

<script>
/* ===== Tetapan =====
   CSV_URL: pautan "Publish to web" (CSV) bagi tab "Cabutan" sahaja (lajur A = NAMA, B = TEMPAT).
   Boleh juga diberi melalui ?csv=<pautan>. ?demo=1 untuk nama contoh; ?demo=150 untuk 150 nama contoh. */
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQl1aX4ZyK5__h5B4o1FBZMeWOWwkO5znmmisufD385Ec7DvyBl-mbLu_PGWP5B3eVCl4l8mS5c7iUs/pub?gid=1893845792&single=true&output=csv';
const KUNCI = 'cabutan-hk-sklotong-2026';

const $ = (id) => document.getElementById(id);
const param = new URLSearchParams(location.search);
let peserta = [];            // [{id, nama, tempat}]
let pemenang = [];           // [{id, nama, tempat, batal}]
let sedangPutar = false, bunyiOn = true;
const petakMap = new Map();  // id -> elemen petak

try { pemenang = JSON.parse(localStorage.getItem(KUNCI) || '[]'); } catch { pemenang = []; }
const simpan = () => { try { localStorage.setItem(KUNCI, JSON.stringify(pemenang)); } catch {} };

/* ---- CSV ---- */
function bacaCsv(teks) {
  const baris = []; let r = [], f = '', q = false;
  for (let i = 0; i < teks.length; i++) {
    const c = teks[i];
    if (q) { if (c === '"') { if (teks[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { r.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && teks[i+1] === '\n') i++; r.push(f); baris.push(r); r = []; f = ''; }
    else f += c;
  }
  if (f !== '' || r.length) { r.push(f); baris.push(r); }
  return baris;
}
function bina(baris) {
  const kira = {}; const out = [];
  for (const b of baris) {
    const nama = (b[0] || '').replace(/\s+/g, ' ').trim().toUpperCase();
    const tempat = (b[1] || '').replace(/\s+/g, ' ').trim().toUpperCase();
    if (!nama || nama === 'NAMA') continue;
    const asas = nama + '|' + tempat; kira[asas] = (kira[asas] || 0) + 1;
    out.push({ id: asas + '|' + kira[asas], nama, tempat });
  }
  return out;
}
const bakiPool = () => { const ambil = new Set(pemenang.map(p => p.id)); return peserta.filter(p => !ambil.has(p.id)); };
function status(t, ralat) { const s = $('status'); s.textContent = t; s.classList.toggle('ralat', !!ralat); }

/* ---- Papan grid ---- */
function binaPapan() {
  const papan = $('papan'); papan.innerHTML = ''; petakMap.clear();
  if (!peserta.length) { papan.innerHTML = '<div class="papan-kosong">Belum ada nama peserta.</div>'; susunPapan(); return; }
  const frag = document.createDocumentFragment();
  for (const p of peserta) {
    const d = document.createElement('div'); d.className = 'petak'; d.dataset.id = p.id;
    const n = document.createElement('div'); n.className = 'n'; n.textContent = p.nama;
    const t = document.createElement('div'); t.className = 't'; t.textContent = p.tempat;
    const g = document.createElement('div'); g.className = 'tanda';
    d.append(g, n, t); frag.append(d); petakMap.set(p.id, d);
  }
  papan.append(frag); susunPapan(); statusPetak();
}
function statusPetak() {
  const rekod = new Map(pemenang.map(p => [p.id, p]));
  for (const [id, el] of petakMap) {
    const r = rekod.get(id);
    el.classList.toggle('menang', !!r && !r.batal); el.classList.toggle('batal', !!r && !!r.batal);
    el.querySelector('.tanda').textContent = r ? (r.batal ? 'Tiada di dewan' : '🏆 Sudah menang') : '';
  }
}
/* Pilih bilangan lajur yang memberi tulisan paling besar sambil memuatkan nama terpanjang sepenuhnya (maks 4 baris).
   Jika tulisan menjadi terlalu kecil untuk dibaca, guna saiz minimum dan papan ditatal. */
const LEBAR_HURUF = .7, GARIS_MAKS = 4;
function garisPerlu(nama, cpl) {               // balut perkataan secara tamak
  let garis = 1, panjang = 0;
  for (const w of nama.split(' ')) {
    const n = w.length;
    if (n > cpl) { garis += Math.ceil(n / cpl) - (panjang ? 0 : 1); panjang = n % cpl; continue; }
    if (!panjang) panjang = n; else if (panjang + 1 + n <= cpl) panjang += 1 + n; else { garis++; panjang = n; }
  }
  return garis;
}
function susunPapan() {
  const papan = $('papan'), N = Math.max(peserta.length, 1);
  const W = papan.clientWidth, H = papan.clientHeight; if (!W || !H) return;
  const jarak = Math.round(Math.max(4, Math.min(10, Math.min(W, H) / 90)));
  const dalamW = W - 2 * jarak, dalamH = H - 2 * jarak;
  const MIN = Math.max(14, Math.min(18, H / 45)), MAKS = Math.min(52, H / 7);
  const panjang = [...peserta].sort((x, y) => y.nama.length - x.nama.length).slice(0, 12).map(p => p.nama);
  const garisUntuk = (w, f) => { const cpl = Math.max(4, Math.floor((w / f - 1) / LEBAR_HURUF)); return Math.max(1, ...panjang.map(n => garisPerlu(n, cpl))); };
  const tinggiPerlu = (g, f, tempat) => f * (g * 1.12 + (tempat ? .82 : 0) + .6) + 4;
  // fon terbesar yang muat dalam petak w × h
  const fonMuat = (w, h, tempat) => { for (let f = MAKS; f >= 8; f -= .5) { const g = garisUntuk(w, f); if (g <= GARIS_MAKS && tinggiPerlu(g, f, tempat) <= h) return f; } return 0; };
  let terbaik = null;
  for (const tempat of [true, false]) {
    for (let k = 1; k <= Math.min(N, 30); k++) {
      const b = Math.ceil(N / k), w = (dalamW - jarak * (k - 1)) / k, h = (dalamH - jarak * (b - 1)) / b;
      if (w < MIN * 5) break;
      const f = fonMuat(w, h, tempat);
      if (!terbaik || f > terbaik.f + .01) terbaik = { k, h, f, tempat };
    }
    if (terbaik && terbaik.f >= Math.max(MIN, 20)) break;   // tempat dipapar jika tulisan masih selesa
  }
  let kol = terbaik.k, tinggi = terbaik.h, fon = terbaik.f, tempat = terbaik.tempat, tatal = false;
  if (fon < MIN) {                     // terlalu ramai: saiz minimum yang boleh dibaca, papan ditatal
    tatal = true; fon = MIN; tempat = false; kol = 1;
    for (let k = Math.max(1, Math.floor(dalamW / (MIN * 6))); k >= 1; k--) {
      const w = (dalamW - jarak * (k - 1)) / k; if (garisUntuk(w, fon) <= 3) { kol = k; break; }
    }
    const w = (dalamW - jarak * (kol - 1)) / kol;
    tinggi = tinggiPerlu(Math.min(GARIS_MAKS, garisUntuk(w, fon)), fon, false);
  }
  papan.style.setProperty('--kol', kol); papan.style.setProperty('--tinggi', Math.floor(tinggi) + 'px');

async function muat() {
  const url = param.get('csv') || CSV_URL;

/* ---- Rawak (crypto) ---- */
function rawak(n) { const a = new Uint32Array(1); const had = Math.floor(0x100000000 / n) * n; let x; do { crypto.getRandomValues(a); x = a[0]; } while (x >= had); return x % n; }

/* ---- Bunyi (Web Audio, tiada fail) ---- */
let ac;
function nada(f, t0, dur, jenis = 'triangle', vol = .18, f2) {
  if (!bunyiOn) return; ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  const o = ac.createOscillator(), g = ac.createGain(); o.type = jenis; const t = ac.currentTime + t0;
  o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
const desir = (d = .45) => nada(260, 0, d, 'sawtooth', .05, 1300);
const dentum = () => { nada(150, 0, .25, 'sine', .35, 55); nada(900, 0, .08, 'square', .06); };
const tik = () => nada(1100 + Math.random() * 300, 0, .05, 'square', .05);
const boing = () => nada(220, 0, .35, 'sine', .22, 520);
const fanfare = () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => nada(f, i * .12, i === 5 ? .7 : .2, 'triangle', .2));

/* ---- Konfeti ---- */
const cv = $('konfeti'), cx = cv.getContext('2d'); let serpih = [], animKonfeti = 0;
function konfeti() {
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  const warna = ['#FCB62A', '#FA5242', '#0DB3A6', '#1F4FA3', '#D7262B', '#FFE08A'];
  for (let i = 0; i < 220; i++) serpih.push({ x: cv.width * (.2 + Math.random() * .6), y: cv.height * .4, vx: (Math.random() - .5) * 26 * devicePixelRatio,
    vy: (-Math.random() * 26 - 8) * devicePixelRatio, s: (6 + Math.random() * 8) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: warna[i % warna.length] });
  if (!animKonfeti) langkahKonfeti();
}
function langkahKonfeti() {
  cx.clearRect(0, 0, cv.width, cv.height);
  serpih = serpih.filter(p => p.y < cv.height + 40);
  for (const p of serpih) { p.vy += .55 * devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); }
  animKonfeti = serpih.length ? requestAnimationFrame(langkahKonfeti) : 0;
}

const lapisan = $('lapisan');
const SVGNS = 'http://www.w3.org/2000/svg';
const jeda = (ms) => new Promise(r => setTimeout(r, ms));
const lerp = (a, b, t) => a + (b - a) * t;
const lembut = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const keluar = (t) => 1 - Math.pow(1 - t, 3);
const kepit = (t) => Math.max(0, Math.min(1, t));
/* Jalankan fungsi bingkai(p, ms) selama `ms` milisaat (p = 0..1). */
function jalan(ms, bingkai) {
  return new Promise(selesai => { const mula = performance.now();
    (function f(now) { const p = Math.min(1, (now - mula) / ms); bingkai(p, now - mula); p < 1 ? requestAnimationFrame(f) : selesai(); })(mula); });
}
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); const e = t.content.firstElementChild; lapisan.append(e); return e; }
const letak = (e, x, y, r = 0, s = 1, o = 1) => { e.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) rotate(${r}deg) scale(${s})`; e.style.opacity = o; };
const bezier = (a, c, b, t) => (1 - t) * (1 - t) * a + 2 * (1 - t) * t * c + t * t * b;
function judul(teks) { el(`<div class="judul">${teks}</div>`); }

/* 3. Main Getah: gelang getah dijentik, berpusing dan berhenti mengelilingi petak pemenang */

    e.setAttribute('transform', `rotate(${rot} ${x} ${y})`); });

  await jalan(1100, p => { const t = lembut(p); const spin = p * 1440; set(bezier(x0, cxp, tx, t), bezier(y0, cyp, ty, t), 28 * Math.abs(Math.cos(spin * Math.PI / 180)) + 6, 24, spin * .3); });
  boing();

/* 4. Zero Point: watak melompat tali getah; pendaratan terakhir di petak pemenang */
async function zeroPoint(petak, B) {
  judul('Zero Point!');
  const R = petak.getBoundingClientRect(), tx = R.left + R.width / 2, ty = R.top + R.height / 2;
  const sz = Math.max(46, Math.min(80, R.height * 1.1));
  const svg = document.createElementNS(SVGNS, 'svg'); svg.setAttribute('width', innerWidth); svg.setAttribute('height', innerHeight); lapisan.append(svg);
  svg.innerHTML = `<path id="tali" fill="none" stroke="#D7262B" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 6"/>
    <circle id="t1" r="9" fill="#0E245E"/><circle id="t2" r="9" fill="#0E245E"/>`;
  const tali = svg.querySelector('#tali');
  const watak = el(`<svg viewBox="0 0 60 90" width="${sz}" height="${sz * 1.5}"><circle cx="30" cy="14" r="11" fill="#f2c094" stroke="#0E245E" stroke-width="3"/>
    <path d="M19 9 Q30 -2 41 9" fill="#1D2340"/><rect x="18" y="26" width="24" height="30" rx="8" fill="#0DB3A6" stroke="#0E245E" stroke-width="3"/>
    <path d="M18 32 L4 20 M42 32 L56 20" stroke="#0E245E" stroke-width="5" stroke-linecap="round"/>
    <path d="M24 56 L18 82 M36 56 L42 82" stroke="#0E245E" stroke-width="6" stroke-linecap="round"/></svg>`);
  const xa = B.left + 20, xb = B.right - 20;
  const lukisTali = (y, gegar) => { tali.setAttribute('d', `M${xa} ${y} Q${(xa + xb) / 2} ${y + gegar} ${xb} ${y}`);
    svg.querySelector('#t1').setAttribute('cx', xa); svg.querySelector('#t1').setAttribute('cy', y); svg.querySelector('#t2').setAttribute('cx', xb); svg.querySelector('#t2').setAttribute('cy', y); };
  // tiga paras tali (buku lali → lutut → pinggang) di bawah petak; watak melompat menghampiri petak
  const asasY = Math.min(innerHeight - 40, ty + R.height * .5 + sz * .9);
  const paras = [asasY, asasY - sz * .35, asasY - sz * .7];
  const dari = Math.abs(tx - xa) > Math.abs(tx - xb) ? xa + 30 : xb - 30;
  const titik = [dari, lerp(dari, tx, .4), lerp(dari, tx, .75), tx];
  let y = asasY + sz * .2;
  letak(watak, titik[0], y - sz * .75);
  for (let i = 0; i < 3; i++) {
    lukisTali(paras[i], 0); const xA = titik[i], xB = titik[i + 1], akhir = i === 2, yAkhir = akhir ? ty : y, tinggi = sz * (1.2 + i * .5);
    boing();
    await jalan(akhir ? 800 : 560, p => { const x = lerp(xA, xB, p), yy = lerp(y, yAkhir, p) - Math.sin(p * Math.PI) * tinggi;
      letak(watak, x, yy - sz * .75, (xB - xA > 0 ? 1 : -1) * Math.sin(p * Math.PI) * 18); lukisTali(paras[i], Math.sin(p * Math.PI * 3) * 10 * (1 - p)); });
    tik(); y = yAkhir;
  }
  dentum(); gegarPetak(petak);
  await jalan(420, p => { letak(watak, tx, ty - sz * .75 + Math.sin(p * Math.PI) * 6, 0, 1 + Math.sin(p * Math.PI) * .12, 1 - p * .6); svg.style.opacity = 1 - p; });
}

/* 5. Batu Seremban: lima biji batu dilambung; tangkapan terakhir membalikkan petak pemenang */
async function batuSeremban(petak, B) {
  judul('Batu Seremban!');
  const R = petak.getBoundingClientRect(), tx = R.left + R.width / 2, ty = R.top + R.height / 2;
  const s = Math.max(22, Math.min(38, R.height * .55)), warna = ['#FA5242', '#FCB62A', '#0DB3A6', '#1F4FA3', '#D7262B'];

  const tinggi = Math.min(ty - 20, innerHeight * .3);
  const asal = batu.map((_, i) => [tx + (i - 2) * s * 1.25, ty]);
  await jalan(200, p => batu.forEach((b, i) => letak(b, asal[i][0], asal[i][1], 0, keluar(p))));
  // lambung satu demi satu, kutip yang lain
  for (let i = 0; i < 4; i++) {
    tik();
    await jalan(300, p => { const h = Math.sin(p * Math.PI) * tinggi * (0.6 + i * .12);

    for (let j = i + 1; j < 5; j++) asal[j][0] = lerp(asal[j][0], tx, .25);

  desir(.5);
  await jalan(600, p => batu.forEach((b, i) => { const h = Math.sin(p * Math.PI) * tinggi; letak(b, tx + Math.sin((p + i / 5) * Math.PI * 2) * s * (1 - p) * 1.6, ty - h, p * 540 + i * 70, 1); }));
  dentum(); petak.classList.remove('terbalik'); void petak.offsetWidth; petak.classList.add('terbalik');

}

/* ---- Cabutan ---- */
async function cabut() {
  const pool = bakiPool(); if (sedangPutar || !pool.length) return;
  sedangPutar = true; tutupKad(); kemasKini(); $('tidakHadir').classList.remove('nampak');
  lapisan.innerHTML = ''; document.querySelectorAll('.petak.sasaran').forEach(e => e.classList.remove('sasaran'));
  const menang = pool[rawak(pool.length)];                          // logik rawak sedia ada
  const petak = petakMap.get(menang.id);
  if (petak) {
    const papan = $('papan');
    if (papan.classList.contains('tatal')) {
      papan.style.scrollBehavior = 'auto';
      papan.scrollTop = petak.offsetTop - papan.clientHeight / 2 + petak.offsetHeight / 2;
      papan.style.scrollBehavior = ''; await jeda(60);
    }
    const anim = ANIMASI[pemenang.length % ANIMASI.length];        // bergilir mengikut bilangan cabutan
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    try { if (!reduce) await anim(petak, document.querySelector('.bingkai').getBoundingClientRect()); } catch (e) { console.error(e); }
    petak.classList.add('sasaran');
  }
  pemenang.push({ id: menang.id, nama: menang.nama, tempat: menang.tempat }); simpan();
  sedangPutar = false; kemasKini();
  bukaKad(menang); fanfare(); konfeti();
  $('tidakHadir').classList.add('nampak');
  setTimeout(() => { if (!sedangPutar) lapisan.innerHTML = ''; }, 2500);
}
function bukaKad(m) {
  $('namaMenang').textContent = m.nama; $('tempatMenang').textContent = m.tempat || '';
  const k = $('kadMenang'); k.classList.add('nampak');
  const el = $('namaMenang'); el.style.fontSize = '';
  let saiz = parseFloat(getComputedStyle(el).fontSize); const maks = k.clientHeight * .5;
  while (el.scrollHeight > maks && saiz > 20) { saiz -= 3; el.style.fontSize = saiz + 'px'; }
}
function tutupKad() { $('kadMenang').classList.remove('nampak'); }
function tidakHadir() {
  const akhir = [...pemenang].reverse().find(p => !p.batal); if (!akhir || sedangPutar) return;
  akhir.batal = true; simpan(); kemasKini(); $('tidakHadir').classList.remove('nampak');
  document.querySelectorAll('.petak.sasaran').forEach(e => e.classList.remove('sasaran')); cabut();
}

  const jumlah = n > 1 ? n : nama.length;
  for (let i = 0; i < jumlah; i++) out.push([i < nama.length ? nama[i] : nama[i % nama.length] + ' ' + (Math.floor(i / nama.length) + 1), tempat[i % tempat.length]]);
  return out;
}

/* ---- Butang & kekunci ---- */
$('cabut').onclick = cabut;
$('tidakHadir').onclick = tidakHadir;
$('kadMenang').onclick = tutupKad;
$('muatSemula').onclick = muat;
$('failCsv').onchange = async (e) => { const f = e.target.files[0]; if (!f) return;
  peserta = bina(bacaCsv(await f.text())); status('Senarai daripada fail: ' + f.name); binaPapan(); kemasKini(); e.target.value = ''; };
$('bunyi').onclick = () => { bunyiOn = !bunyiOn; $('bunyi').textContent = bunyiOn ? '🔊 Bunyi' : '🔇 Senyap'; };
const penuh = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
$('skrinPenuh').onclick = penuh;
$('setSemula').onclick = () => { if (sedangPutar) return;
  if (confirm('Kosongkan senarai pemenang? Semua nama akan kembali ke dalam cabutan.')) { pemenang = []; simpan(); tutupKad(); lapisan.innerHTML = '';
    document.querySelectorAll('.petak.sasaran').forEach(e => e.classList.remove('sasaran')); kemasKini(); $('tidakHadir').classList.remove('nampak'); } };
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); cabut(); }
  else if (e.key === 'f' || e.key === 'F') penuh();
  else if (e.key === 'Escape') tutupKad();
});
new ResizeObserver(() => susunPapan()).observe($('papan'));

binaPapan(); kemasKini(); muat();
</script>
